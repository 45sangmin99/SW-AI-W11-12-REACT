<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>노드 뷰어 · VOC 이상 탐지</title>
<style>
:root{--bg:#08080f;--band:#0c0b16;--card:#12121c;--pill:#181826;--wire:#2f3146;--line:#23243a;--t1:#f4f3fa;--t2:#c9c7d6;--t3:#9a98aa;--sel:#8e76f1;--run:#5a3ce6;--pass:#6fe27f;--fail:#f2566f;--fix:#aea4f6;--live:#f5577f;--chip:#d4d0de;--ts:1}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--t2);font:11px/1.4 Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
#app{display:grid;grid-template-rows:80px minmax(0,1fr) 64px;height:100dvh;width:100%}
.top{background:var(--band);border-bottom:1px solid var(--line);padding:6px 16px;display:grid;grid-template-rows:28px 36px;gap:4px;min-width:0}
.row1,.row2{display:flex;align-items:center;gap:16px;min-width:0}
.logo{font-weight:600;color:var(--t1);font-size:13px;white-space:nowrap}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;padding:4px 12px;border-radius:3px;color:var(--t3);white-space:nowrap}
.tab[aria-selected=true]{color:var(--t1);background:var(--pill);box-shadow:inset 0 -2px var(--sel)}
.sp{flex:1}
.live{display:flex;align-items:center;gap:8px;color:var(--t3);white-space:nowrap}
.live label{display:flex;align-items:center;gap:4px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 12px var(--live);animation:pulse 2s ease-in-out infinite}
.live.off .dot{background:var(--wire);box-shadow:none;animation:none}
@keyframes pulse{50%{opacity:.4}}
.btn{background:var(--pill);border:1px solid var(--line);border-radius:3px;padding:4px 12px;color:var(--t1);height:24px;white-space:nowrap}
.btn:hover{border-color:var(--sel)}
.btn.on{border-color:var(--sel);color:var(--sel)}
.btn.go{background:var(--run);border-color:var(--run)}
.title{font-size:18px;font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.ver{background:var(--pill);border:1px solid var(--line);border-radius:3px;padding:0 8px;height:18px;line-height:16px;font-size:10px;color:var(--t2);white-space:nowrap}
.memo{flex:1 1 0;min-width:0;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memo2{display:none}
.stats{display:flex;gap:24px}
.stat{text-align:right;min-width:36px}
.stat b{display:block;font-size:22px;line-height:22px;color:var(--t1);font-weight:500}
.stat span{font-size:10px;color:var(--t3)}
.stat.p b{color:var(--pass)}.stat.f b{color:var(--fail)}.stat.x b{color:var(--fix)}
#view{position:relative;min-height:0;overflow:hidden}
#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 50%,#0b0b14,var(--bg) 70%)}
#vp.pan{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world>*,#gl>*,#nl>*{position:absolute}
#wires{left:0;top:0;overflow:visible;pointer-events:none}
#cv{pointer-events:none}
.gbox{border:1px solid var(--gb);background:var(--gf);border-radius:10px;pointer-events:none}
.gl{position:absolute;left:12px;top:8px;display:flex;gap:8px;color:var(--t2);white-space:nowrap;font-size:calc(11px*var(--ts))}
.gl i{font-style:normal;color:var(--t3)}
.card{position:absolute;width:248px;background:var(--card);border:1px solid var(--bc);border-radius:8px;padding:8px 12px;user-select:none;transition:opacity .2s}
.card.sel{border-color:var(--sel);box-shadow:0 0 24px rgba(142,118,241,.3)}
.card.blocked{opacity:.45}
.card.run{border-color:var(--run);animation:breathe 2.4s ease-in-out infinite}
.card.failed{border-color:var(--fail)}
@keyframes breathe{0%,100%{box-shadow:0 0 6px rgba(90,60,230,.25)}50%{box-shadow:0 0 24px rgba(90,60,230,.85)}}
.c-head{display:flex;align-items:center;gap:8px;height:22px;cursor:grab}
.sq{width:8px;height:8px;border-radius:2px;flex:none;background:var(--gc)}
.nm{font-size:calc(13px*var(--ts));line-height:22px;color:var(--t1);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tag{font-size:10px;line-height:14px;padding:0 4px;border-radius:3px;border:1px solid currentColor;flex:none}
.plan{font-size:10px;line-height:14px;padding:0 4px;border-radius:3px;border:1px dashed var(--t3);color:var(--t3);flex:none}
.c-mid{display:flex;justify-content:space-between;align-items:center;gap:8px;height:20px;margin-top:4px}
.model{background:var(--pill);border-radius:3px;padding:0 8px;height:18px;line-height:18px;font-size:10px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sw{display:flex;align-items:center;gap:4px;flex:none;font-size:10px;color:var(--t3)}
.st.run{background:var(--run);color:#fff;padding:0 8px;border-radius:3px}
.st.pass{color:var(--pass)}
.st.fail{background:var(--fail);color:#12121c;padding:0 8px;border-radius:3px}
.st.fixed{color:var(--fix)}
.fixbtn{background:none;border:1px solid var(--fix);color:var(--fix);border-radius:3px;font-size:10px;padding:0 4px;height:18px}
.c-role{height:32px;margin-top:4px;line-height:16px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--t2)}
.c-role.bad{color:var(--fail)}
.c-ports{margin:8px -12px 0}
.pr{position:relative;height:16px;display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-size:10px;color:var(--t3);gap:8px}
.pr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc{position:absolute;top:4px;width:8px;height:8px;border-radius:50%;background:var(--card);border:1.5px solid var(--gc)}
.pc.l{left:-5px}.pc.r{right:-5px}
.compact .card{padding:5px 12px}
.compact .c-mid,.compact .c-role{display:none}
.compact .c-ports{position:absolute;inset:0;margin:0}
.compact .pr{position:absolute;inset:0;height:auto;padding:0}
.compact .pr span{display:none}
.compact .pc{top:calc(50% - 4px)}
.srcp{width:168px;height:32px;border-radius:16px;background:var(--pill);border:1px solid var(--line);display:flex;align-items:center;padding:0 16px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub{width:100px;height:100px;border-radius:50%;background:#f4f3fa;color:#12121c;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
.chip{width:92px;height:24px;border-radius:3px;background:var(--chip);color:#1b1a24;font-size:10px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.ring{width:140px;height:140px;border-radius:50%;border:6px solid var(--pass);box-shadow:0 0 24px rgba(111,226,127,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--t2)}
.ring b{font-size:22px;line-height:26px;color:var(--t1);font-weight:500}
.ringcap{width:140px;text-align:center;color:var(--t3);font-size:10px}
#mini{position:absolute;left:12px;top:12px;z-index:5;display:flex;flex-direction:column;gap:8px}
#mini canvas{width:140px;height:70px;background:var(--band);border:1px solid var(--line);border-radius:4px;cursor:pointer;touch-action:none}
.zoom{display:flex;gap:4px}
.zoom .btn{padding:0 8px}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:5;background:#2a1018;border:1px solid var(--fail);color:#ffc9d2;border-radius:4px;padding:4px 12px;max-width:90%;text-align:center}
.drawer{position:absolute;right:0;top:0;bottom:0;width:380px;background:#0f0f19;border-left:1px solid var(--line);z-index:6;display:flex;flex-direction:column}
.drawer[hidden]{display:none}
.dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dh b{flex:1;font-size:13px;color:var(--t1);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt{display:flex;gap:4px;padding:8px 16px 0}
.db{padding:16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{color:var(--t3);font-size:10px}
.fld input,.fld textarea,.fld select{background:var(--pill);border:1px solid var(--line);border-radius:3px;padding:4px 8px;color:var(--t1);min-height:28px;width:100%}
.fld textarea{resize:vertical}
.chk{flex-direction:row;align-items:center;gap:8px}
.chk input{width:auto;min-height:0}
.lr{display:flex;align-items:center;gap:8px;background:var(--pill);border-radius:3px;padding:4px 8px}
.lr button.go2{flex:1;text-align:left;background:none;border:0;color:var(--t1);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .x{background:none;border:0;color:var(--fail)}
.sub{color:var(--t3);font-size:10px;margin-top:4px}
.logrow{display:flex;gap:8px;color:var(--t2)}
.panel{position:absolute;inset:0;background:var(--bg);overflow:auto;padding:16px;z-index:4}
.panel[hidden]{display:none}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--t3);font-weight:400;font-size:10px}
tr.rw{cursor:pointer}tr.rw:hover{background:var(--pill)}
#json{width:100%;height:60vh;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px;color:var(--t1);font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.err{color:var(--fail);margin:8px 0;min-height:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bot{background:var(--band);border-top:1px solid var(--line);padding:8px 16px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;min-width:0}
.log{display:flex;flex-direction:column;gap:0;min-width:0;overflow:hidden}
.log div{height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t2)}
.log .s-pass{color:var(--pass)}.log .s-fail{color:var(--fail)}.log .s-running{color:var(--sel)}.log .s-fixed{color:var(--fix)}
.cmd{align-self:center;background:var(--pill);border:1px solid var(--line);border-radius:3px;padding:4px 12px;color:var(--t1);height:28px;width:100%}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--pill);border:1px solid var(--line);border-radius:4px;padding:4px 12px;z-index:7;color:var(--t1);max-width:90%}
@media (max-width:767px){
 #app{grid-template-rows:auto minmax(0,1fr) auto}
 .top{grid-template-rows:auto auto auto;padding:8px 12px;gap:4px}
 .row1{gap:8px}.logo{display:none}.tab{padding:4px 8px}
 .live .lt,.live label,.ver,.memo{display:none}
 .stat.n4,.stat.n5{display:none}.stats{gap:16px}
 .memo2{display:block;color:var(--t3);font-size:10px}
 .drawer{left:0;right:0;top:auto;bottom:0;width:auto;height:70vh;border-left:0;border-top:1px solid var(--line)}
 .bot{grid-template-columns:minmax(0,1fr);gap:4px;padding:8px 12px}
 .log div:nth-child(1){display:none}
}
@media (prefers-reduced-motion:reduce){.dot,.card.run{animation:none}}
</style>
</head>
<body>
<div id="app">
 <header class="top">
  <div class="row1">
   <span class="logo">노드 뷰어</span>
   <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="graph" aria-selected="true">그래프</button>
    <button class="tab" role="tab" data-tab="nodes" aria-selected="false">노드</button>
    <button class="tab" role="tab" data-tab="runs" aria-selected="false">실행</button>
    <button class="tab" role="tab" data-tab="json" aria-selected="false">기록</button>
   </nav>
   <span class="sp"></span>
   <span class="live off" id="live"><i class="dot"></i><span class="lt">LIVE</span><label title="./status.json을 2초마다 읽습니다"><input type="checkbox" id="livechk">status.json</label></span>
   <button class="btn go" id="bRun" title="실행 (R)">▶ 실행</button>
   <button class="btn" id="bStop" title="정지">■</button>
   <button class="btn on" id="bLoop" title="빛 반복">↻ 반복</button>
  </div>
  <div class="row2">
   <span class="title" id="title"></span><span class="ver" id="ver"></span><span class="memo" id="memo"></span>
   <div class="stats" id="stats"></div>
  </div>
  <div class="memo2" id="memo2"></div>
 </header>
 <main id="view">
  <div id="vp"><div id="world"><div id="gl"></div><svg id="wires" width="1" height="1"></svg><canvas id="cv"></canvas><div id="nl"></div></div></div>
  <div id="mini" class="ui"><canvas id="mc" width="280" height="140" aria-label="미니맵"></canvas><div class="zoom"><button class="btn" id="zin" aria-label="확대">+</button><button class="btn" id="zout" aria-label="축소">−</button><button class="btn" id="zfit">맞춤</button></div></div>
  <div id="banner"></div>
  <aside class="drawer ui" id="drawer" hidden></aside>
  <section class="panel" id="p-nodes" hidden></section>
  <section class="panel" id="p-runs" hidden></section>
  <section class="panel" id="p-json" hidden>
   <div class="bar"><button class="btn go" id="jApply">적용</button><button class="btn" id="jExport">내보내기</button><button class="btn" id="jImport">불러오기</button><button class="btn" id="jReset">예시로 되돌리기</button><input type="file" id="jFile" accept="application/json,.json" hidden></div>
   <div class="err" id="jErr" role="alert"></div>
   <textarea id="json" spellcheck="false" aria-label="그래프 JSON"></textarea>
  </section>
  <div class="toast" id="toast" hidden></div>
 </main>
 <footer class="bot">
  <div class="log" id="log" aria-live="polite"></div>
  <input class="cmd" id="cmd" placeholder="그래프 수정을 말해 보세요" aria-label="그래프 수정 명령" autocomplete="off">
 </footer>
</div>
<script>
"use strict";
const KEY="object-note-voc-node-viewer-v1";
const COLORS=["#c38af6","#f47eb9","#f1a476","#f8cd52","#948ceb","#6df4d1"];
const KC={AI:"#aea4f6","코드":"#9a98aa","사람":"#f8cd52"};
const STL={idle:"대기",wait:"대기",running:"실행 중",pass:"통과",fail:"실패",fixed:"고침",blocked:"막힘",info:"안내"};
const NW=248,RES=1.5,WHITE="#c9c7d6";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`};
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const now=()=>performance.now()/1000;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

const N=(id,name,group,kind,model,role,inputs,outputs,x={})=>({id,name,group,kind,model,role,inputs,outputs,duration:null,fail:false,failReason:"",...x});
const DEFAULT={
 title:"OBJECT NOTE 고객 문의(VOC) 이상 탐지",version:"Step 4 목표 구조",memo:"예시 흐름 · 실제 숫자 아님",
 sources:[{id:"s1",name:"고객 문의 JSON"},{id:"s2",name:"필터 선택"}],
 groups:[{id:"g1",name:"데이터 준비"},{id:"g2",name:"조건 설정"},{id:"g3",name:"저장·조회"},{id:"g4",name:"이상 탐지"},{id:"g5",name:"응답·반영"},{id:"g6",name:"확인"}],
 nodes:[
  N("n1","파일 불러오기","g1","코드","data.js","JSON 파일을 읽어 문의 목록으로 바꾼다",["문의 JSON"],["문의 목록"],{failReason:"불러오기에 실패하면 오류를 표시"}),
  N("n2","형식 검증","g1","코드","data.js","형식이 틀린 문의는 빼고 건수를 알린다",["문의 목록"],["검증된 문의"],{failReason:"형식이 틀린 문의 제외"}),
  N("n3","필터 설정","g2","사람","사용자","검색어·기간·유형·기기·앱 버전을 고른다",["필터 선택"],["조건"]),
  N("n4","응답 캐시 확인","g2","코드","Mini Redis","같은 조건의 이전 응답이 있는지 확인한다",["조건"],["조건"],{planned:true}),
  N("n5","문의 저장","g3","코드","Mini DBMS","문의를 저장하고 검색용 인덱스를 만든다",["문의"],["저장됨"],{planned:true}),
  N("n6","문의 조회","g3","코드","Mini DBMS","조건에 맞는 문의를 꺼낸다",["조건","저장됨"],["문의"],{planned:true}),
  N("n7","시간대별 집계","g4","코드","analysis.js","시간대별로 문의를 센다",["문의"],["집계"]),
  N("n8","문의 급증","g4","코드","analysis.js","평소보다 갑자기 늘었는지 본다",["집계"],["급증"],{fail:true,failReason:"이력 3일 미만이라 판정 불가"}),
  N("n9","유형 쏠림","g4","코드","analysis.js","특정 유형 비중이 쏠렸는지 본다",["집계"],["유형"],{failReason:"필터를 한 값으로 좁히면 쏠림이 항상 100%"}),
  N("n10","기기·버전 쏠림","g4","코드","analysis.js","특정 기기·앱 버전에 몰렸는지 본다",["집계"],["환경"]),
  N("n11","반복 문구","g4","코드","analysis.js","같은 문장이 반복되는지 본다",["문의"],["문구"]),
  N("n12","병합·심각도","g4","코드","analysis.js","연속 시간을 합치고 심각도를 정한다",["급증","유형","환경","문구"],["신호 목록"]),
  N("n13","응답 캐시 저장","g5","코드","Mini Redis","계산한 응답을 캐시에 저장한다",["신호 목록"],["응답"],{planned:true}),
  N("n14","화면 그리기","g5","코드","components.js","신호 카드·차트·근거 목록을 그린다",["응답"],["가상 DOM"]),
  N("n15","바뀐 부분만 반영","g5","코드","diff.js · patch.js","이전 화면과 비교해 바뀐 곳만 고친다",["가상 DOM"],["화면"]),
  N("n16","신호 확인","g6","사람","사용자","신호를 골라 근거 문의를 확인한다",["화면"],["선택"]),
  N("n17","진행 상태 변경","g6","사람","사용자","신호의 진행 상태를 바꾸고 이력을 남긴다",["선택"],["기록"],{planned:true})
 ],
 edges:[
  {from:"n1:문의 목록",to:"n2:문의 목록"},{from:"n2:검증된 문의",to:"n5:문의"},

const bez=(a,c1,c2,b,t)=>{const u=1-t;return{x:u*u*u*a.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*b.x,y:u*u*u*a.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*b.y}};
function wire(p0,p3){const d=Math.max(40,Math.abs(p3.x-p0.x)*.5),c1={x:p0.x+d,y:p0.y},c2={x:p3.x-d,y:p3.y},pts=[],cum=[];let len=0;
 for(let i=0;i<=48;i++){const p=bez(p0,c1,c2,p3,i/48);if(i)len+=Math.hypot(p.x-pts.at(-2),p.y-pts.at(-1));pts.push(p.x,p.y);cum.push(len)}return{p0,c1,c2,p3,pts,cum,len}}
function pointAt(g,s){if(s<=0)return{x:g.pts[0],y:g.pts[1]};if(s>=g.len)return{x:g.pts.at(-2),y:g.pts.at(-1)};let lo=0,hi=g.cum.length-1;
 while(hi-lo>1){const m=(lo+hi)>>1;if(g.cum[m]<s)lo=m;else hi=m}const f=(s-g.cum[lo])/(g.cum[hi]-g.cum[lo]||1);
 return{x:g.pts[lo*2]+(g.pts[hi*2]-g.pts[lo*2])*f,y:g.pts[lo*2+1]+(g.pts[hi*2+1]-g.pts[lo*2+1])*f}}
function tracePart(ctx,g,s0,s1){const a=pointAt(g,s0);ctx.beginPath();ctx.moveTo(a.x,a.y);
 for(let i=0;i<g.cum.length;i++)if(g.cum[i]>s0&&g.cum[i]<s1)ctx.lineTo(g.pts[i*2],g.pts[i*2+1]);const b=pointAt(g,s1);ctx.lineTo(b.x,b.y)}
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;

function validate(text){
 let m;try{m=JSON.parse(text)}catch(e){let line=null,col=null;const p=/position (\d+)/.exec(e.message);

  if(ids.has(n.id))return bad(`id가 겹칩니다: ${n.id}`,`"${n.id}"`);
  ids.add(n.id);
  if(typeof n.name!=="string")return bad(`${n.id}: name이 필요합니다`,`"${n.id}"`);
  if(!gids.has(n.group))return bad(`${n.id}: 없는 구간 ${n.group}`,`"${n.id}"`);
  ports.set(n.id,{i:n.inputs?.length?n.inputs:["입력"],o:n.outputs?.length?n.outputs:["출력"]})}

  if(f[1]!==undefined&&!ports.get(f[0]).o.includes(f[1]))return bad(`${f[0]}에 없는 출력 포트: ${f[1]}`,`"${e.from}"`);
  if(t[1]!==undefined&&!ports.get(t[0]).i.includes(t[1]))return bad(`${t[0]}에 없는 입력 포트: ${t[1]}`,`"${e.to}"`)}

function analyze(){

 const E=M.edges.map((e,i)=>{const[a,ap]=e.from.split(":"),[b,bp]=e.to.split(":");const A=byId.get(a),B=byId.get(b);
  return{i,a,b,ai:Math.max(0,A.outputs.indexOf(ap)),bi:Math.max(0,B.inputs.indexOf(bp))}});

function at(t,fn){evs.push({t,fn})}
const wdur=w=>reduced?.02:Math.min(.95,Math.max(.38,w.g.len/760));
function launch(w,t){w.t0=t;w.t1=t+wdur(w);w.done=false;at(w.t1,()=>arrive(w))}
function flash(el,c,big){if(reduced||!el)return;el.animate([{boxShadow:`0 0 ${big?48:28}px ${rgba(c,.95)}`,filter:"brightness(1.5)"},{boxShadow:`0 0 0 ${rgba(c,0)}`,filter:"brightness(1)"}],{duration:1100,easing:"ease-out"})}
function arrive(w){w.done=true;w.arrT=w.t1;const v=V.get(w.to);flash(v.el,v.color,v.k==="ring");
 if(v.k==="node"){const pc=$$(".pr",v.el)[w.ti]?.querySelector(".pc.l");flash(pc,w.color)}
 if(v.k==="ring"){ringCount++;setRing()}
 if(v.inc.every(x=>x.done))fire(v,w.t1)}
function fire(v,t){
 if(v.k==="ring"){if(S.mode==="demo"&&S.repeat&&!reduced){const id=cycleId;at(t+2.4,()=>{if(S.mode==="demo"&&id===cycleId)cycleStart(now())})}if(S.mode==="run")log("info","","완료 고리에 모두 도착");return}
 if(v.k==="node"){if(S.mode==="live")return;if(S.mode==="run"){startNode(v.node,t);return}}
 const dep=t+.06;v.out.forEach((w,i)=>launch(w,dep+(w.kind==="chip"?i*.07:0)))}
function cycleStart(t){cycleId++;ringCount=0;setRing();W.forEach(w=>w.done=false);
 SRC.forEach((s,i)=>s.v.out.forEach(w=>launch(w,t+i*.14)))}
function startNode(n,t){const r=rt(n);r.status="running";r.t=t;r.prog=0;setStatus(n);log("running",n.name,"실행 시작");
 const dur=(n.duration>0?n.duration:.9)*(reduced?.05:1);at(t+dur,()=>endNode(n,t+dur))}
function endNode(n,t){const r=rt(n);if(n.fail&&!r.fixed){r.status="fail";setStatus(n);log("fail",n.name,n.failReason||"실패");recomputeBlocked();renderStats();return}finishNode(n,t)}
function finishNode(n,t){const r=rt(n);r.status="pass";r.prog=1;setStatus(n);log(r.fixed?"fixed":"pass",n.name,r.fixed?"고친 뒤 통과":"통과");renderStats();V.get(n.id).out.forEach(w=>launch(w,t))}
function recomputeBlocked(){const bad=[...M.nodes].filter(n=>rt(n).status==="fail"),blocked=new Set();
 const walk=id=>G.out.get(id).forEach(e=>{if(!G.back.has(e.i)&&!blocked.has(e.b)){blocked.add(e.b);walk(e.b)}});bad.forEach(n=>walk(n.id));
 M.nodes.forEach(n=>{const r=rt(n);if(blocked.has(n.id)&&(r.status==="wait"||r.status==="idle"))r.status="blocked";else if(!blocked.has(n.id)&&r.status==="blocked")r.status="wait";setStatus(n)})}
function fixNode(id){const n=G.byId.get(id),r=rt(n);if(!n||r.status!=="fail")return;r.fixed=true;fixedN++;r.status="running";r.prog=0;setStatus(n);recomputeBlocked();
 S.running=true;log("fixed",n.name,"고치기");const t=now(),d=reduced?.02:.6;at(t+d,()=>finishNode(n,t+d));renderStats()}
function resetWires(arr){W.forEach(w=>{w.t0=w.t1=0;w.done=false;w.arrT=arr?-1e3:null})}
function startDemo(){evs=[];S.mode="demo";S.running=false;cycleId++;ringCount=0;M.nodes.forEach(n=>Object.assign(rt(n),{status:"idle",fixed:false,prog:0}));M.nodes.forEach(setStatus);
 resetWires(reduced);if(reduced){ringCount=M.items.length;setRing()}else{setRing();cycleStart(now()+.3)}renderStats()}
function startRun(){evs=[];cycleId++;S.mode="run";S.running=true;fixedN=0;resetWires(false);ringCount=0;setRing();
 M.nodes.forEach(n=>Object.assign(rt(n),{status:"wait",fixed:false,prog:0}));M.nodes.forEach(setStatus);
 curRun={no:RUNS.length+1,at:new Date(),done:false};RUNS.push(curRun);log("info","","실행 시작");recomputeBlocked();cycleStart(now()+.1);renderStats()}
function stopAll(){S.live=false;$("#livechk").checked=false;syncLive();startDemo()}
function setRing(){const b=$("b",V.get("ring").el);b.textContent=`${ringCount}/${M.items.length}`}
function finishRun(){S.running=false;const c=counts();curRun.done=true;Object.assign(curRun,c,{fixed:fixedN});log("info","",`실행 끝 · 통과 ${c.pass} · 실패 ${c.fail} · 막힘 ${c.blocked}`);renderStats();renderRuns()}
function counts(){const c={pass:0,fail:0,blocked:0,wait:0,running:0};M.nodes.forEach(n=>{const s=rt(n).status;if(s==="pass")c.pass++;else if(s==="fail")c.fail++;else if(s==="blocked")c.blocked++;else if(s==="running")c.running++;else c.wait++});return c}

/* ---------- 그리기 ---------- */
function frame(){
 const t=now();
 if(evs.length){const due=evs.filter(e=>e.t<=t);if(due.length){evs=evs.filter(e=>e.t>t);due.sort((a,b)=>a.t-b.t).forEach(e=>e.fn())}}
 M.nodes.forEach(n=>{const r=rt(n);if(r.status==="running"){const d=(n.duration>0?n.duration:.9)*(reduced?.05:1);const p=clamp((t-r.t)/d,0,1);if(Math.floor(p*M.items.length)!==Math.floor(r.prog*M.items.length)){r.prog=p;setStatus(n)}else r.prog=p}});
 if(S.mode==="run"&&S.running&&!evs.length&&t>0)finishRun();
 draw(t);requestAnimationFrame(frame)}
function draw(t){
 const c=S.cb;if(!c)return;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(RES,0,0,RES,-c.x*RES,-c.y*RES);
 ctx.globalCompositeOperation="lighter";ctx.lineCap="round";ctx.lineJoin="round";
 for(const w of W){if(w.back)continue;const g=w.g,col=w.color;
  const fly=t>=w.t0&&t<w.t1&&w.t1>0&&!w.done;
  if(fly){const p=(t-w.t0)/(w.t1-w.t0),s=ease(p)*g.len;
   ctx.strokeStyle=rgba(col,.22*.6);ctx.lineWidth=6;tracePart(ctx,g,0,s);ctx.stroke();
   ctx.strokeStyle=rgba(col,.9*.6);ctx.lineWidth=1.6;tracePart(ctx,g,0,s);ctx.stroke();
   const s0=Math.max(0,s-120);ctx.strokeStyle=rgba(col,.35);ctx.lineWidth=7;tracePart(ctx,g,s0,s);ctx.stroke();
   ctx.strokeStyle=rgba(col,1);ctx.lineWidth=2.4;tracePart(ctx,g,s0,s);ctx.stroke();
   const h=pointAt(g,s),gr=ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,10);gr.addColorStop(0,"rgba(255,255,255,.95)");gr.addColorStop(.35,rgba(col,.7));gr.addColorStop(1,rgba(col,0));
   ctx.fillStyle=gr;ctx.beginPath();ctx.arc(h.x,h.y,10,0,7);ctx.fill()}
  else if(w.arrT!==null){const b=reduced?.45:.16+.84*Math.exp(-Math.max(0,t-w.arrT)/1.9);
   ctx.strokeStyle=rgba(col,.22*b);ctx.lineWidth=6;tracePart(ctx,g,0,g.len);ctx.stroke();
   ctx.strokeStyle=rgba(col,.9*b);ctx.lineWidth=1.6;tracePart(ctx,g,0,g.len);ctx.stroke()}}
 ctx.globalCompositeOperation="source-over"}

 const items=[["노드",M.nodes.length,""],["작업",M.items.length,""],["통과",ran?c.pass:dash,"p"],["실패",ran?c.fail:dash,"f"],["고침",ran?fixedN:dash,"x"]];
 $("#stats").innerHTML=items.map((s,i)=>`<div class="stat n${i+1} ${s[2]}"><b>${s[1]}</b><span>${s[0]}</span></div>`).join("");
 $("#title").textContent=M.title;$("#ver").textContent=M.version||"";
 const memo=M.memo+(ran?` · 막힘 ${c.blocked} · 대기 ${c.wait+c.running}`:"");$("#memo").textContent=memo;$("#memo").title=memo;$("#memo2").textContent=memo;
 document.title="노드 뷰어 · "+M.title}
function log(st,node,msg){const d=new Date(),p=n=>String(n).padStart(2,"0");LOG.push({time:`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`,st,node,msg});if(LOG.length>300)LOG.shift();renderLog()}
function renderLog(){const l=LOG.slice(-3);$("#log").innerHTML=(l.length?l:[{time:"--:--:--",st:"info",node:"",msg:"▶ 실행을 누르면 기록이 쌓입니다"}]).map(e=>`<div class="s-${e.st}">${e.time} · ${STL[e.st]||e.st}${e.node?` · → ${esc(e.node)}`:""}${e.msg?` · ${esc(e.msg)}`:""}</div>`).join("");
 const k=$("#log").children;while(k.length<3)$("#log").prepend(document.createElement("div"))}

function structural(){save();const keep=S.sel;build();S.sel=keep&&G.byId.has(keep)?keep:null;if(!S.sel)closeDrawer();else setStatus(G.byId.get(S.sel));if(S.live)startLive();else startDemo();renderTables();syncJson()}
function nextId(){let k=M.nodes.length+1;while(G.byId.has("n"+k))k++;return "n"+k}
function addNode(name,x,y,group){const g=group||M.groups[0]?.id;const n={id:nextId(),name:name||"새 노드",group:g,kind:"코드",model:"-",role:"하는 일을 적어 주세요",inputs:["입력"],outputs:["출력"],duration:null,fail:false,failReason:""};
 if(x!==undefined)n.pos={x,y};M.nodes.push(n);log("info",n.name,"노드 추가");structural();openDrawer(n.id);return n}
function removeNode(id){M.nodes=M.nodes.filter(n=>n.id!==id);M.edges=M.edges.filter(e=>e.from.split(":")[0]!==id&&e.to.split(":")[0]!==id);S.sel=null;log("info","","노드 삭제");structural()}
function findNode(q){q=q.trim();return M.nodes.find(n=>n.id===q||n.name===q)||M.nodes.find(n=>n.name.includes(q))}
$("#cmd").addEventListener("keydown",e=>{if(e.key!=="Enter")return;const q=e.target.value.trim();if(!q)return;e.target.value="";
 let m;
 if(m=/^추가\s+(.+)$/.exec(q)){const c=center0();addNode(m[1],c.x,c.y,nearestGroup(c.x))}
 else if(m=/^삭제\s+(.+)$/.exec(q)){const n=findNode(m[1]);if(n)removeNode(n.id);else toast("그런 노드가 없습니다")}
 else if(m=/^연결\s+(.+?)\s*>\s*(.+)$/.exec(q)){const a=findNode(m[1]),b=findNode(m[2]);if(a&&b){M.edges.push({from:a.id+":"+a.outputs[0],to:b.id+":"+b.inputs[0]});log("info",b.name,`연결 ${a.name} → ${b.name}`);structural()}else toast("노드를 찾지 못했습니다")}
 else toast("지원하는 말: 추가 이름 / 삭제 이름 / 연결 A > B")});
const center0=()=>{const r=vp.getBoundingClientRect();return toWorld(r.left+r.width/2,r.top+r.height/2)};
function nearestGroup(x){let best=null,bd=1e9;$$(".gbox").forEach(b=>{if(b.hidden)return;const cx=parseFloat(b.style.left)+parseFloat(b.style.width)/2,d=Math.abs(cx-x);if(d<bd){bd=d;best=b.dataset.g}});return best||M.groups[0]?.id}

 else if(S.dtab==="log"){const l=LOG.filter(e=>e.node===n.name).slice(-40).reverse();

let pollT=null;
function syncLive(){$("#live").classList.toggle("off",!S.live);clearInterval(pollT);if(S.live){poll();pollT=setInterval(poll,2000)}}
function startLive(){evs=[];S.mode="live";S.running=false;seen=new Set();resetWires(false);ringCount=0;setRing();
 M.nodes.forEach(n=>Object.assign(rt(n),{status:"wait",fixed:false,prog:0}));M.nodes.forEach(setStatus);fixedN=0;cycleStart(now()+.1);renderStats()}
async function poll(){
 try{const r=await fetch("./status.json",{cache:"no-store"});if(!r.ok)throw new Error(r.status);const arr=await r.json();if(!Array.isArray(arr))throw new Error("배열이 아닙니다");
  $("#toast").hidden=true;
  arr.slice().sort((a,b)=>String(a.at).localeCompare(String(b.at))).forEach(x=>{const key=`${x.node}|${x.at}|${x.status}`;if(seen.has(key))return;seen.add(key);
   const n=G.byId.get(x.node)||M.nodes.find(o=>o.name===x.node);if(!n)return;const r2=rt(n),t=now();
   if(x.status==="running"){r2.status="running";r2.t=t;r2.prog=0;setStatus(n);log("running",n.name,x.msg||"")}
   else if(x.status==="pass"||x.status==="fixed"){if(x.status==="fixed"){r2.fixed=true;fixedN++}finishNode(n,t);if(x.msg)log(x.status==="fixed"?"fixed":"pass",n.name,x.msg)}
   else if(x.status==="fail"){r2.status="fail";n.failReason=x.msg||n.failReason;setStatus(n);log("fail",n.name,x.msg||"");recomputeBlocked();renderStats()}})}
 catch(e){S.live=location.protocol==="file:"?false:S.live;if(location.protocol==="file:"){$("#livechk").checked=false;syncLive();startDemo()}
  toast("status.json을 읽지 못했습니다. 터미널에서 python3 -m http.server 로 연 뒤 접속해 주세요")}}

/* ---------- 조작 ---------- */
const ptrs=new Map();let drag=null;
vp.addEventListener("pointerdown",e=>{
 if(e.target.closest(".ui")||e.target.closest("button"))return;
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});vp.setPointerCapture(e.pointerId);
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];drag={type:"pinch",d:Math.hypot(a.x-b.x,a.y-b.y)};return}
 const card=e.target.closest(".card");
 if(card){const n=G.byId.get(card.dataset.id),p=P(n);drag={type:e.target.closest(".c-head")?"node":"click",n,sx:e.clientX,sy:e.clientY,ox:p.x,oy:p.y,moved:false}}
 else{drag={type:"pan",sx:e.clientX,sy:e.clientY,tx:S.tx,ty:S.ty};vp.classList.add("pan")}});
vp.addEventListener("pointermove",e=>{
 if(!ptrs.has(e.pointerId)||!drag)return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(drag.type==="pinch"&&ptrs.size>=2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=vp.getBoundingClientRect();zoomAt(d/drag.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);drag.d=d;return}
 if(drag.type==="pan"){S.tx=drag.tx+e.clientX-drag.sx;S.ty=drag.ty+e.clientY-drag.sy;S.moved=true;applyView()}
 else if(drag.n){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(!drag.moved&&Math.hypot(dx,dy)<4)return;drag.moved=true;
  if(drag.type==="node"){drag.n.pos={x:drag.ox+dx/S.scale,y:drag.oy+dy/S.scale};if(!drag.raf)drag.raf=requestAnimationFrame(()=>{drag.raf=0;geom()})}}});
function endPtr(e){ptrs.delete(e.pointerId);vp.classList.remove("pan");
 if(drag&&drag.n&&!drag.moved&&ptrs.size===0)openDrawer(drag.n.id);
 else if(drag&&drag.type==="node"&&drag.moved){save();geom();const keep=S.cb;S.cb=null;geom()}
 if(ptrs.size<2&&drag&&drag.type==="pinch")drag=null;if(!ptrs.size)drag=null}
vp.addEventListener("pointerup",endPtr);vp.addEventListener("pointercancel",endPtr);
vp.addEventListener("wheel",e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
vp.addEventListener("dblclick",e=>{if(e.target.closest(".card,.ui"))return;const p=toWorld(e.clientX,e.clientY);addNode("새 노드",p.x-NW/2,p.y-40,nearestGroup(p.x))});
nl.addEventListener("click",e=>{const b=e.target.closest("[data-fix]");if(b){e.stopPropagation();fixNode(b.dataset.fix)}});
$("#zin").onclick=()=>{const r=vp.getBoundingClientRect();zoomAt(1.25,r.width/2,r.height/2)};
$("#zout").onclick=()=>{const r=vp.getBoundingClientRect();zoomAt(.8,r.width/2,r.height/2)};
$("#zfit").onclick=fit;
$("#bRun").onclick=()=>{if(S.live){S.live=false;$("#livechk").checked=false;syncLive()}setTab("graph");startRun()};
$("#bStop").onclick=stopAll;
$("#bLoop").onclick=e=>{S.repeat=!S.repeat;e.currentTarget.classList.toggle("on",S.repeat);if(S.mode==="demo")startDemo()};
$("#livechk").onchange=e=>{S.live=e.target.checked;if(S.live)startLive();else startDemo();syncLive()};
$$(".tab[data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function toggleCompact(){S.compact=!S.compact;world.classList.toggle("compact",S.compact);LAY.clear();layout();geom();fit()}
document.addEventListener("keydown",e=>{
 if(e.target.matches("input,textarea,select")||e.metaKey||e.ctrlKey||e.altKey)return;
 const k=e.key.toLowerCase();
 if(k==="f")fit();else if(k==="r")$("#bRun").click();else if(k==="g")toggleCompact();
 else if(e.key==="Escape"){if(!$("#drawer").hidden)closeDrawer();else if(S.tab!=="graph")setTab("graph")}});
$("#p-nodes").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.row)e.target.click()});
new ResizeObserver(()=>{if(M&&!S.moved)fit();else if(M)drawMini()}).observe(vp);
